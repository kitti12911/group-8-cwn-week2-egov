name: egov-eservice
# One command:  TEST_MODE=1 docker compose up --build
#   TEST_MODE=1        → /api/test/* open (unset → 404)
#   BUG_MODE=B03,B07   → enable bugs from BUGS.md (unset → correct web)
#   HOST_PORT=3000     → host port (default 3000)
services:
  web:
    build: .
    image: egov-eservice:local
    container_name: egov-eservice-web
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      TEST_MODE: "${TEST_MODE:-}"
      BUG_MODE: "${BUG_MODE:-}"
      DB_PATH: /data/egov.db
      TZ: Asia/Bangkok
      PORT: "3000"
    volumes:
      - ./data:/data        # DB_PATH on host = ./data/egov.db (TC-NFR-04 inspection)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
